version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: edusaas-postgres
    environment:
      POSTGRES_DB: edusaas
      POSTGRES_USER: edusaas
      POSTGRES_PASSWORD: edusaas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edusaas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: edusaas-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
    name: edusaas-postgres-data