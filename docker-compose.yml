services:

  postgres:
    image: postgres:16-alpine
    container_name: edusaas-postgres
    environment:
      POSTGRES_DB: edusaas
      POSTGRES_USER: edusaas
      POSTGRES_PASSWORD: edusaas
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edusaas-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: edusaas-mailhog
    ports:
      - "1026:1025"
      - "8026:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: edusaas-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8181
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: edusaas-postgres-data